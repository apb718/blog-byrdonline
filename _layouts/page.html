---
layout: default
---
<div class="container">
  <article class="page">
    <header class="page__header">
      {% if page.label %}<div class="page__label">{{ page.label }}</div>{% endif %}
      <h1 class="page__title">{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page__subtitle">{{ page.subtitle }}</p>{% endif %}
    </header>
    <div class="page__content">
      {{ content }}
    </div>
  </article>
</div>
